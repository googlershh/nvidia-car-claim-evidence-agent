name: Case demo — build and deploy
on:
  pull_request:
    paths: ['demo/**', '.github/workflows/case-demo.yml']
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/case-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            demo/editor/package-lock.json
      - name: Install locked demo dependencies
        run: |
          npm ci --prefix demo
          npm ci --prefix demo/editor
      - name: Build the static sharing bundle
        run: npm run build --prefix demo
      - name: Install browser for demo verification
        working-directory: demo/editor
        run: npx playwright install --with-deps chromium
      - name: Verify case interactions, DOCX editing, and route isolation
        env:
          DEMO_URL: http://127.0.0.1:8767/
        run: |
          python3 demo/scripts/serve.py --root demo/dist --port 8767 > /tmp/demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/ > /dev/null; then break; fi
            sleep 1
          done
          npm test --prefix demo
      - name: Validate Workers static asset configuration
        working-directory: demo
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: case-demo-static
          path: demo/dist/
          include-hidden-files: false
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: case-demo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci --prefix demo
      - uses: actions/download-artifact@v4
        with:
          name: case-demo-static
          path: demo/dist
      - name: Publish only the demo to Cloudflare Workers
        working-directory: demo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
