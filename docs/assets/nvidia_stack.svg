<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스택 다이어그램">
  <style>text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }</style>
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <!-- runtime frame -->
  <rect x="8" y="58" width="744" height="270" rx="10" fill="#f6f8fa" stroke="#76b900" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="20" y="76" font-size="11" font-weight="700" fill="#4d7a00">OpenShell 샌드박스 · NemoClaw — 네트워크 기본 차단, 필요한 목적지만 허용, 자격증명은 샌드박스 밖</text>

  <!-- user -->
  <rect x="235" y="6" width="290" height="36" rx="8" fill="#1b1f24"/>
  <text x="380" y="29" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">보험사 보상 담당자 (목표 입력 · 최종 승인)</text>
  <line x1="380" y1="42" x2="380" y2="92" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- agent -->
  <rect x="160" y="92" width="440" height="46" rx="8" fill="#fff" stroke="#1b1f24" stroke-width="1.5"/>
  <text x="380" y="111" font-size="12" text-anchor="middle" font-weight="700">NemoClaw 에이전트 (OpenClaw 하네스)</text>
  <text x="380" y="128" font-size="10" text-anchor="middle" fill="#57606a">계획·도구 호출: Nemotron 3 Super (OpenRouter 경유) · claim-evidence 스킬</text>

  <!-- tools row -->
  <g font-size="10" text-anchor="middle">
    <rect x="24" y="160" width="136" height="54" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="92" y="180" font-weight="700">영상 분석</text><text x="92" y="196" fill="#57606a">사고유형·진행·충돌</text><text x="92" y="209" fill="#57606a">시각 근거</text>
    <rect x="170" y="160" width="136" height="54" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="238" y="180" font-weight="700">인정기준 조회</text><text x="238" y="196" fill="#57606a">제10차 도표 108개</text><text x="238" y="209" fill="#57606a">수정요소 829개</text>
    <rect x="316" y="160" width="136" height="54" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="384" y="180" font-weight="700">진술 대조</text><text x="384" y="196" fill="#57606a">피보험자·상대 보험사</text><text x="384" y="209" fill="#57606a">주장 vs 영상</text>
    <rect x="462" y="160" width="136" height="54" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="530" y="180" font-weight="700">손해액·이상징후</text><text x="530" y="196" fill="#57606a">사진↔견적 대조</text><text x="530" y="209" fill="#57606a">충돌부위 모순→SIU</text>
    <rect x="608" y="160" width="136" height="54" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="676" y="180" font-weight="700">문서 작성</text><text x="676" y="196" fill="#57606a">협의 근거·조정 요청</text><text x="676" y="209" fill="#57606a">SIU 메모·사정서</text>
  </g>
  <line x1="380" y1="138" x2="380" y2="150" stroke="#57606a" stroke-width="1.5"/>
  <line x1="92" y1="150" x2="676" y2="150" stroke="#57606a" stroke-width="1.5"/>
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="92" y1="150" x2="92" y2="160"/><line x1="238" y1="150" x2="238" y2="160"/><line x1="384" y1="150" x2="384" y2="160"/><line x1="530" y1="150" x2="530" y2="160"/><line x1="676" y1="150" x2="676" y2="160"/>
  </g>

  <!-- model services -->
  <rect x="24" y="232" width="282" height="84" rx="8" fill="#eef7dd" stroke="#76b900"/>
  <text x="165" y="251" font-size="11" text-anchor="middle" font-weight="700" fill="#4d7a00">VSS Blueprint (GPU 자체 서빙)</text>
  <text x="165" y="268" font-size="10" text-anchor="middle">Cosmos3 Nano Reasoner (NIM) — 영상 이해</text>
  <text x="165" y="283" font-size="10" text-anchor="middle">VSS Agent (NeMo Agent Toolkit) · VST 영상 저장</text>
  <text x="165" y="298" font-size="10" text-anchor="middle">vss-ask-video 등 VSS 스킬 → 수정요소 재조사</text>
  <line x1="92" y1="214" x2="92" y2="232" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="316" y="232" width="282" height="84" rx="8" fill="#e8f1fc" stroke="#0969da"/>
  <text x="457" y="251" font-size="11" text-anchor="middle" font-weight="700" fill="#0969da">모델 API (OpenRouter · build.nvidia.com)</text>
  <text x="457" y="268" font-size="10" text-anchor="middle">Nemotron 3 Super — 에이전트 계획·도구 호출</text>
  <text x="457" y="283" font-size="10" text-anchor="middle">Nemotron 3.5 Lightning — VSS 에이전트</text>
  <text x="457" y="298" font-size="10" text-anchor="middle">DeepSeek-V4.1-Flash — 프레임 판정 비교</text>

  <rect x="608" y="232" width="136" height="84" rx="8" fill="#fff8e5" stroke="#9a6700"/>
  <text x="676" y="251" font-size="11" text-anchor="middle" font-weight="700" fill="#9a6700">근거 데이터</text>
  <text x="676" y="268" font-size="9.5" text-anchor="middle">과실비율 인정기준</text>
  <text x="676" y="282" font-size="9.5" text-anchor="middle">AI Hub 사고 영상</text>
  <text x="676" y="296" font-size="9.5" text-anchor="middle">파손 사진·견적서</text>
  <text x="676" y="310" font-size="9.5" text-anchor="middle">(쏘카 손해사정 결과)</text>

  <!-- hardware -->
  <rect x="8" y="334" width="744" height="22" rx="6" fill="#1b1f24"/>
  <text x="380" y="349" font-size="10.5" fill="#fff" text-anchor="middle">실행 환경: Brev RTX A6000 48GB 한 대에 VSS + NemoClaw · 사고 영상은 같은 GPU의 Cosmos3가 분석</text>
</svg>