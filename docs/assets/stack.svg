<svg viewBox="0 0 760 384" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="스택 다이어그램">
  <style>
    .t  { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #f2f2f2; font-size: 10.5px; text-anchor: middle; }
    .s  { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #a8adb3; font-size: 9px; text-anchor: middle; }
    .h  { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #ffffff; font-size: 12.5px; font-weight: 700; }
    .e  { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #e6e6e6; font-size: 9px; font-style: italic;
          paint-order: stroke; stroke: #0b0b0b; stroke-width: 5px; stroke-linejoin: round; }
    .ln { stroke: #e6e6e6; stroke-width: 1.3; fill: none; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
    <!-- NVIDIA model (NIM) hexagon -->
    <g id="nim">
      <polygon points="0,-20 22.5,-7 22.5,19 0,32 -22.5,19 -22.5,-7" fill="#4f7d00"/>
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="#0f0f0f" stroke="#76b900" stroke-width="2.5"/>
      <g stroke="#76b900" stroke-width="1.3" fill="none">
        <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6"/>
        <line x1="0" y1="-12" x2="0" y2="12"/><line x1="10.4" y1="-6" x2="-10.4" y2="6"/><line x1="10.4" y1="6" x2="-10.4" y2="-6"/>
      </g>
      <g fill="#76b900">
        <circle r="3.2"/><circle cx="0" cy="-12" r="2.2"/><circle cx="10.4" cy="-6" r="2.2"/><circle cx="10.4" cy="6" r="2.2"/>
        <circle cx="0" cy="12" r="2.2"/><circle cx="-10.4" cy="6" r="2.2"/><circle cx="-10.4" cy="-6" r="2.2"/>
      </g>
    </g>
    <!-- process (yellow) -->
    <rect id="yl" x="-22" y="-22" width="44" height="44" rx="3" fill="#f5c400"/>
    <!-- data (orange) -->
    <rect id="or" x="-22" y="-22" width="44" height="44" rx="3" fill="#e5641b"/>
    <!-- glyphs -->
    <g id="g-gear" fill="none" stroke="#fff">
      <circle r="10" stroke-width="4.5" stroke-dasharray="3.9 3.95"/><circle r="8" stroke-width="2"/><circle r="3.5" stroke-width="2"/>
    </g>
    <g id="g-doc" fill="none" stroke="#fff" stroke-width="2">
      <path d="M-9,-13 H4 L10,-7 V13 H-9 Z"/><path d="M4,-13 V-7 H10"/>
      <line x1="-5" y1="-3" x2="6" y2="-3"/><line x1="-5" y1="2" x2="6" y2="2"/><line x1="-5" y1="7" x2="2" y2="7"/>
    </g>
    <g id="g-lens" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <circle cx="-3" cy="-3" r="8"/><line x1="3" y1="3" x2="11" y2="11"/>
    </g>
    <g id="g-book" fill="none" stroke="#fff" stroke-width="2">
      <path d="M0,-9 C-4,-12 -9,-12 -12,-10 V10 C-9,8 -4,8 0,11 C4,8 9,8 12,10 V-10 C9,-12 4,-12 0,-9 Z"/><line x1="0" y1="-9" x2="0" y2="11"/>
    </g>
    <g id="g-files" fill="none" stroke="#fff" stroke-width="2">
      <rect x="-12" y="-8" width="17" height="14" rx="1.5"/><rect x="-5" y="-2" width="17" height="14" rx="1.5" fill="#e5641b"/>
      <circle cx="0" cy="3" r="2" fill="#fff" stroke="none"/><path d="M-3,11 L3,5 L7,9 L9,7 L12,10"/>
    </g>
    <g id="g-talk" fill="none" stroke="#fff" stroke-width="2">
      <path d="M-12,-10 H8 V3 H-4 L-9,8 V3 H-12 Z"/><path d="M11,-5 H13 V9 H10 V13 L5,9 H-3"/>
    </g>
    <g id="g-video" fill="none" stroke="#fff" stroke-width="2">
      <rect x="-12" y="-9" width="24" height="18" rx="2"/><path d="M-3,-4 L5,0 L-3,4 Z" fill="#fff"/>
    </g>
    <g id="g-db" fill="none" stroke="#fff" stroke-width="2">
      <ellipse cx="0" cy="-8" rx="10" ry="4"/><path d="M-10,-8 V8 C-10,13 10,13 10,8 V-8"/><path d="M-10,0 C-10,5 10,5 10,0"/>
    </g>
  </defs>

  <rect x="0" y="0" width="760" height="384" rx="10" fill="#0b0b0b"/>
  <text class="h" x="18" y="26">Agent Pipeline</text>

  <!-- OpenShell sandbox -->
  <rect x="128" y="36" width="620" height="212" rx="8" fill="none" stroke="#76b900" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="140" y="52" style="font-family:'Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#8fd11a">OpenShell 샌드박스 · NemoClaw — 네트워크 기본 차단, 필요한 목적지만 허용, 자격증명은 샌드박스 밖</text>

  <!-- user -->
  <circle cx="52" cy="192" r="21" fill="#1a73e8"/>
  <circle cx="52" cy="185" r="6.5" fill="#fff"/><path d="M40,203 C40,191 64,191 64,203 Z" fill="#fff"/>
  <text class="t" x="52" y="228">대물보상 담당자</text>
  <text class="s" x="52" y="240">목표 입력 · 최종 승인</text>

  <!-- goal row -->
  <line class="ln" x1="74" y1="192" x2="172" y2="192" marker-end="url(#arw)"/>
  <text class="e" x="118" y="195" text-anchor="middle">목표 한 줄</text>

  <use href="#nim" xlink:href="#nim" transform="translate(200,188)"/>
  <text class="t" x="200" y="232">OpenClaw 에이전트</text>
  <text class="s" x="200" y="244">Nemotron 3 Super</text>

  <line class="ln" x1="228" y1="192" x2="296" y2="192" marker-end="url(#arw)"/>
  <use href="#yl" xlink:href="#yl" transform="translate(320,192)"/><use href="#g-gear" xlink:href="#g-gear" transform="translate(320,192)"/>
  <text class="t" x="320" y="232">claim-evidence 스킬</text>
  <text class="s" x="320" y="244">계획 · 도구 선택</text>

  <line class="ln" x1="344" y1="192" x2="408" y2="192" marker-end="url(#arw)"/>
  <rect x="410" y="152" width="318" height="88" rx="6" fill="#2a2d31"/>
  <use href="#or" xlink:href="#or" transform="translate(470,184)"/><use href="#g-book" xlink:href="#g-book" transform="translate(470,184)"/>
  <text class="t" x="470" y="220">과실비율 인정기준</text><text class="s" x="470" y="232">제10차 · 도표 108개</text>
  <use href="#or" xlink:href="#or" transform="translate(575,184)"/><use href="#g-files" xlink:href="#g-files" transform="translate(575,184)"/>
  <text class="t" x="575" y="220">사고 자료</text><text class="s" x="575" y="232">영상 · 사진 · 견적서</text>
  <use href="#or" xlink:href="#or" transform="translate(675,184)"/><use href="#g-talk" xlink:href="#g-talk" transform="translate(675,184)"/>
  <text class="t" x="675" y="220">진술 · 주장</text><text class="s" x="675" y="232">피보험자 · 상대사</text>

  <!-- response row -->
  <path class="ln" d="M728,172 H738 V96 H702" marker-end="url(#arw)"/>
  <use href="#yl" xlink:href="#yl" transform="translate(678,96)"/><use href="#g-lens" xlink:href="#g-lens" transform="translate(678,96)"/>
  <text class="t" x="678" y="132">과실 · 손해액 판단</text>
  <text class="s" x="678" y="144">도표 · 진술 · 사진 대조</text>

  <line class="ln" x1="654" y1="96" x2="546" y2="96" marker-end="url(#arw)"/>
  <use href="#yl" xlink:href="#yl" transform="translate(522,96)"/><use href="#g-doc" xlink:href="#g-doc" transform="translate(522,96)"/>
  <text class="t" x="522" y="132">협의 근거 문서</text>
  <text class="s" x="522" y="144">조정 요청 · SIU 메모</text>

  <path class="ln" d="M498,96 H52 V169" marker-end="url(#arw)"/>
  <text class="e" x="300" y="99" text-anchor="middle">초안 → 담당자 승인 후 발송</text>

  <!-- agent <-> VSS -->
  <line class="ln" x1="192" y1="252" x2="192" y2="270" marker-end="url(#arw)"/>
  <line class="ln" x1="208" y1="270" x2="208" y2="252" marker-end="url(#arw)"/>
  <text class="e" x="186" y="265" text-anchor="end">구간 질문 (수정요소 재조사)</text>
  <text class="e" x="214" y="265" text-anchor="start">영상 속 사실 · 시각</text>

  <!-- video pipeline -->
  <text class="h" x="18" y="290">Video Pipeline</text><text x="18" y="304" style="font-family:'Malgun Gothic',sans-serif;font-size:9.5px;fill:#8fd11a">VSS Blueprint</text>

  <use href="#or" xlink:href="#or" transform="translate(690,306)"/><use href="#g-video" xlink:href="#g-video" transform="translate(690,306)"/>
  <text class="t" x="690" y="342">블랙박스 영상</text><text class="s" x="690" y="354">mp4 → H.264</text>
  <line class="ln" x1="668" y1="306" x2="564" y2="306" marker-end="url(#arw)"/>
  <text class="e" x="616" y="309" text-anchor="middle">upload</text>

  <use href="#or" xlink:href="#or" transform="translate(540,306)"/><use href="#g-db" xlink:href="#g-db" transform="translate(540,306)"/>
  <text class="t" x="540" y="342">VST 영상 저장</text><text class="s" x="540" y="354">센서 · 클립</text>
  <line class="ln" x1="518" y1="306" x2="418" y2="306" marker-end="url(#arw)"/>
  <text class="e" x="468" y="309" text-anchor="middle">clip</text>

  <use href="#nim" xlink:href="#nim" transform="translate(390,302)"/>
  <text class="t" x="390" y="346">Cosmos3 Nano Reasoner</text><text class="s" x="390" y="358">영상 이해 · GPU 자체 서빙(NIM)</text>
  <line class="ln" x1="362" y1="306" x2="228" y2="306" marker-end="url(#arw)"/>
  <text class="e" x="295" y="309" text-anchor="middle">video_understanding</text>

  <use href="#nim" xlink:href="#nim" transform="translate(200,302)"/>
  <text class="t" x="200" y="346">VSS 에이전트</text><text class="s" x="200" y="358">NeMo Agent Toolkit · Nemotron 3.5 Lightning</text>

  <!-- hardware -->
  <rect x="8" y="364" width="744" height="16" rx="4" fill="#1d2126"/>
  <text x="380" y="375.5" style="font-family:'Malgun Gothic',sans-serif;font-size:9px;fill:#d0d4d8;text-anchor:middle">실행 환경: Brev RTX A6000 48GB 한 대에 VSS + NemoClaw · 사고 영상은 같은 GPU의 Cosmos3가 분석 · 모델 API: OpenRouter · build.nvidia.com</text>
</svg>
